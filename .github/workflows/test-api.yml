# .github/workflows/test-api.yml
name: API Tests

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Ruff
        run: |
          pip install ruff 
          ruff check . --output-format=github

      - name: Build test image
        run: docker build -t api-tests .

      - name: Start API
        run: docker compose up -d

      - name: Create results directory
        run: mkdir -p allure-results

      - name: Run tests
        run: |
          docker run --rm \
            --network="test-network" \
            -v $(pwd)/allure-results:/app/allure-results \
            -e AUTH_SERVICE_API_URL=http://auth:8000 \
            -e UNIVERSITY_SERVICE_API_URL=http://university:8000 \
            api-tests
        continue-on-error: true

      - name: Check results
        if: always()
        run: |
          echo "=== allure-results contents ==="
          ls -la allure-results/
          echo "=== JSON files count ==="
          find allure-results -name "*.json" | wc -l

      # Установка Allure с проверкой
      - name: Install Allure
        if: always()
        run: |
          echo "Installing Allure..."
          sudo apt-get update
          sudo apt-get install -y wget
          sudo wget -qO /usr/local/bin/allure https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz
          sudo tar -xzf /usr/local/bin/allure -C /usr/local/bin/
          sudo ln -s /usr/local/bin/allure-2.24.1/bin/allure /usr/local/bin/allure
          allure --version

      - name: Generate Allure report
        if: always()
        run: |
          mkdir -p allure-report
          
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            echo "✅ Generating report from results"
            /usr/local/bin/allure generate allure-results --clean -o allure-report
          else
            echo "⚠️ No test results, creating placeholder"
            echo "<html><body><h1>No test results available</h1></body></html>" > allure-report/index.html
          fi
          
          echo "=== allure-report contents ==="
          ls -la allure-report/

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Cleanup
        if: always()
        run: docker compose down -v